<svg viewBox="0 0 320 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Login screen">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1f1f"/>
      <stop offset="1" stop-color="#081717"/>
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5e0"/>
      <stop offset="1" stop-color="#06e0f9"/>
    </linearGradient>
    <linearGradient id="mtq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#86dde4"/>
      <stop offset="1" stop-color="#2a9aa6"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="308" height="648" rx="44" fill="#05090b" stroke="#1f2a2a" stroke-width="2"/>
  <rect x="16" y="16" width="288" height="628" rx="36" fill="url(#bg)"/>
  <rect x="124" y="24" width="72" height="14" rx="7" fill="#05090b"/>

  <!-- MONET logo -->
  <g transform="translate(36 96) scale(0.88)" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="64" fill="url(#mtq)" text-anchor="middle">
    <text x="30" y="64">M</text>
    <text x="148" y="64">N</text>
    <text x="194" y="64">E</text>
    <text x="236" y="64">T</text>
  </g>
  <g transform="translate(36 96) scale(0.88)">
    <circle cx="88" cy="40" r="26" fill="none" stroke="url(#mtq)" stroke-width="9"/>
    <g stroke="#39a9b4" stroke-width="1" opacity="0.45">
      <line x1="74" y1="22" x2="74" y2="58"/><line x1="88" y1="18" x2="88" y2="62"/><line x1="102" y1="22" x2="102" y2="58"/>
      <line x1="68" y1="30" x2="108" y2="30"/><line x1="66" y1="40" x2="110" y2="40"/><line x1="68" y1="50" x2="108" y2="50"/>
    </g>
    <path d="M70 54 L80 47 L88 51 L101 30" fill="none" stroke="#d9482f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M93 29 L102 28 L101 37" fill="none" stroke="#d9482f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M70 196 H150 l5 -12 6 22 5 -16 4 6 H250" fill="none" stroke="#39b0bb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>

  <!-- Card -->
  <rect x="40" y="252" width="240" height="316" rx="20" fill="#0f2e2e" stroke="#1a4040" stroke-width="1"/>
  <text x="160" y="292" font-family="Arial" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="bold">Welcome Back</text>

  <rect x="64" y="312" width="192" height="44" rx="11" fill="#0d2525" stroke="#1a4040"/>
  <text x="80" y="340" font-family="Arial" font-size="13" fill="#6b9a9a">Email</text>

  <rect x="64" y="366" width="192" height="44" rx="11" fill="#0d2525" stroke="#1a4040"/>
  <text x="80" y="394" font-family="Arial" font-size="13" fill="#6b9a9a">••••••••</text>

  <rect x="64" y="424" width="192" height="44" rx="22" fill="url(#cta)"/>
  <text x="160" y="452" font-family="Arial" font-size="15" fill="#0d2a2a" text-anchor="middle" font-weight="bold" letter-spacing="1">Login</text>

  <text x="160" y="498" font-family="Arial" font-size="12" fill="#7ecfcf" text-anchor="middle">Forget Password</text>
  <text x="160" y="528" font-family="Arial" font-size="12" fill="#00e5ff" text-anchor="middle" font-weight="bold">Create an account</text>
</svg>
