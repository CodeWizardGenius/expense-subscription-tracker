<svg viewBox="0 0 320 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Home dashboard screen">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#112426"/>
      <stop offset="1" stop-color="#121314"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="308" height="648" rx="44" fill="#05090b" stroke="#1f2a2a" stroke-width="2"/>
  <rect x="16" y="16" width="288" height="628" rx="36" fill="url(#bg)"/>
  <rect x="124" y="24" width="72" height="14" rx="7" fill="#05090b"/>

  <!-- Header -->
  <circle cx="52" cy="72" r="18" fill="#4b5563"/>
  <text x="52" y="78" font-family="Arial" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">E</text>
  <text x="80" y="66" font-family="Arial" font-size="10" fill="#6b7280">Welcome back.</text>
  <text x="80" y="82" font-family="Arial" font-size="15" fill="#fff" font-weight="bold">Emre</text>
  <path d="M276 64 h-8 a3 3 0 0 0 -3 3 v14 a3 3 0 0 0 3 3 h8 M281 67 l5 5 -5 5 M286 72 h-12" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Total balance card -->
  <rect x="32" y="100" width="256" height="78" rx="22" fill="#0d1a1a" stroke="#00f5e01a"/>
  <text x="52" y="128" font-family="Arial" font-size="13" fill="#00f5e0" font-weight="bold">Total Balance</text>
  <text x="52" y="156" font-family="Arial" font-size="24" fill="#fff" font-weight="bold">$3,420.00</text>
  <rect x="196" y="124" width="76" height="32" rx="16" fill="#00f5e0"/>
  <text x="234" y="145" font-family="Arial" font-size="11" fill="#000" text-anchor="middle" font-weight="bold">+ Add Money</text>

  <!-- Spending donut card -->
  <rect x="32" y="190" width="122" height="150" rx="18" fill="#111b1b"/>
  <text x="48" y="214" font-family="Arial" font-size="12" fill="#fff" font-weight="bold">Spending</text>
  <circle cx="48" cy="210" r="0"/>
  <g transform="translate(93 256)">
    <circle r="26" fill="none" stroke="#1a2e2e" stroke-width="9"/>
    <circle r="26" fill="none" stroke="#00f5e0" stroke-width="9" stroke-dasharray="80 83" transform="rotate(-90)" stroke-linecap="round"/>
    <circle r="26" fill="none" stroke="#a855f7" stroke-width="9" stroke-dasharray="45 118" stroke-dashoffset="-80" transform="rotate(-90)" stroke-linecap="round"/>
    <circle r="26" fill="none" stroke="#f97316" stroke-width="9" stroke-dasharray="30 133" stroke-dashoffset="-125" transform="rotate(-90)" stroke-linecap="round"/>
    <text y="4" font-family="Arial" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold">30d</text>
  </g>
  <circle cx="50" cy="316" r="3" fill="#00f5e0"/><text x="60" y="320" font-family="Arial" font-size="9" fill="#6b7280">Food</text>
  <circle cx="50" cy="330" r="3" fill="#a855f7"/><text x="60" y="334" font-family="Arial" font-size="9" fill="#6b7280">Transport</text>

  <!-- Goal card -->
  <rect x="166" y="190" width="122" height="150" rx="18" fill="#111b1b"/>
  <text x="182" y="214" font-family="Arial" font-size="12" fill="#fff" font-weight="bold">Goal</text>
  <text x="266" y="216" font-family="Arial" font-size="13" text-anchor="end">&#128681;</text>
  <text x="182" y="248" font-family="Arial" font-size="20" fill="#fff" font-weight="bold">$1,240</text>
  <text x="182" y="266" font-family="Arial" font-size="9" fill="#6b7280">of $5,000.00 target</text>
  <rect x="182" y="288" width="90" height="6" rx="3" fill="#1f2937"/>
  <rect x="182" y="288" width="34" height="6" rx="3" fill="#3b82f6"/>
  <text x="182" y="318" font-family="Arial" font-size="10" fill="#00f5e0" font-weight="bold">24.8%</text>
  <text x="272" y="318" font-family="Arial" font-size="9" fill="#6b7280" text-anchor="end">Reached</text>

