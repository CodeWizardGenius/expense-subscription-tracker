  <text x="280" y="370" font-family="Arial" font-size="11" fill="#00f5e0" text-anchor="end" font-weight="bold">Add New</text>

  <g font-family="Arial">
    <rect x="32" y="384" width="256" height="50" rx="16" fill="#111b1b"/>
    <rect x="44" y="396" width="26" height="26" rx="8" fill="#00f5e020"/>
    <text x="57" y="414" font-size="13" fill="#00f5e0" text-anchor="middle">&#127828;</text>
    <text x="82" y="406" font-size="12" fill="#fff" font-weight="bold">Lunch</text>
    <text x="82" y="421" font-size="9" fill="#6b7280">Today, 13:20</text>
    <text x="276" y="414" font-size="13" fill="#fff" text-anchor="end" font-weight="bold">-$18.50</text>

    <rect x="32" y="442" width="256" height="50" rx="16" fill="#111b1b"/>
    <rect x="44" y="454" width="26" height="26" rx="8" fill="#a855f720"/>
    <text x="57" y="472" font-size="13" fill="#a855f7" text-anchor="middle">&#128663;</text>
    <text x="82" y="464" font-size="12" fill="#fff" font-weight="bold">Transport</text>
    <text x="82" y="479" font-size="9" fill="#6b7280">Jun 14, 09:05</text>
    <text x="276" y="472" font-size="13" fill="#fff" text-anchor="end" font-weight="bold">-$4.00</text>

    <rect x="32" y="500" width="256" height="50" rx="16" fill="#111b1b"/>
    <rect x="44" y="512" width="26" height="26" rx="8" fill="#f9731620"/>
    <text x="57" y="530" font-size="13" fill="#f97316" text-anchor="middle">&#127968;</text>
    <text x="82" y="522" font-size="12" fill="#fff" font-weight="bold">Rent</text>
    <text x="82" y="537" font-size="9" fill="#6b7280">Jun 01, 10:00</text>
    <text x="276" y="530" font-size="13" fill="#fff" text-anchor="end" font-weight="bold">-$900.00</text>
  </g>

  <!-- Tab bar -->
  <rect x="44" y="586" width="232" height="50" rx="25" fill="#171717" stroke="#454949" stroke-width="2"/>
  <g stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M70 618 v-8 l8 -6 8 6 v8 z" stroke="#06e0f9"/>
    <circle cx="113" cy="611" r="8" stroke="#6b7280"/><text x="113" y="615" font-size="9" fill="#6b7280" text-anchor="middle" stroke="none">$</text>
    <path d="M156 604 v14 M149 611 h14" stroke="#6b7280"/>
    <path d="M192 618 v-7 M199 618 v-12 M206 618 v-9" stroke="#6b7280"/>
    <path d="M243 618 a8 8 0 0 1 16 0 M251 606 a4 4 0 1 0 0.1 0" stroke="#6b7280"/>
  </g>
</svg>
