<svg viewBox="0 0 320 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Analytics screen">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e14"/>
      <stop offset="1" stop-color="#0a0e14"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="308" height="648" rx="44" fill="#05090b" stroke="#1f2a2a" stroke-width="2"/>
  <rect x="16" y="16" width="288" height="628" rx="36" fill="url(#bg)"/>
  <rect x="124" y="24" width="72" height="14" rx="7" fill="#05090b"/>

  <text x="160" y="68" font-family="Arial" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">Analytics</text>

  <!-- Period tabs -->
  <rect x="40" y="84" width="240" height="40" rx="20" fill="#0d1a1a" stroke="#374151"/>
  <text x="100" y="109" font-family="Arial" font-size="13" fill="#4b7070" text-anchor="middle" font-weight="bold">Week</text>
  <rect x="124" y="90" width="72" height="28" rx="14" fill="#0d2e2a"/>
  <text x="160" y="109" font-family="Arial" font-size="13" fill="#00f5e0" text-anchor="middle" font-weight="bold">Month</text>
  <text x="220" y="109" font-family="Arial" font-size="13" fill="#4b7070" text-anchor="middle" font-weight="bold">Year</text>

  <!-- Spending breakdown card -->
  <rect x="32" y="136" width="256" height="200" rx="22" fill="#0d1a1a" stroke="#00f5e010"/>
  <text x="48" y="162" font-family="Arial" font-size="13" fill="#fff" font-weight="bold">Spending Breakdown</text>

  <!-- Donut -->
  <g transform="translate(96 230)">
    <circle r="40" fill="none" stroke="#1a2e2e" stroke-width="14"/>
    <circle r="40" fill="none" stroke="#00f5e0" stroke-width="14" stroke-dasharray="138 113" transform="rotate(-90)"/>
    <circle r="40" fill="none" stroke="#a855f7" stroke-width="14" stroke-dasharray="60 191" stroke-dashoffset="-138" transform="rotate(-90)"/>
    <circle r="40" fill="none" stroke="#f97316" stroke-width="14" stroke-dasharray="30 221" stroke-dashoffset="-198" transform="rotate(-90)"/>
    <text y="-2" font-family="Arial" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">55%</text>
    <text y="14" font-family="Arial" font-size="11" fill="#4b7070" text-anchor="middle">$680</text>
  </g>
  <!-- Legend -->
  <g font-family="Arial">
    <circle cx="172" cy="200" r="5" fill="#00f5e0"/><text x="184" y="200" font-size="11" fill="#fff" font-weight="bold">Food</text><text x="184" y="213" font-size="10" fill="#4b7070">55%</text>
    <circle cx="172" cy="228" r="5" fill="#a855f7"/><text x="184" y="228" font-size="11" fill="#fff" font-weight="bold">Transport</text><text x="184" y="241" font-size="10" fill="#4b7070">24%</text>
    <circle cx="172" cy="256" r="5" fill="#f97316"/><text x="184" y="256" font-size="11" fill="#fff" font-weight="bold">Shopping</text><text x="184" y="269" font-size="10" fill="#4b7070">12%</text>
  </g>
  <!-- Stats row -->
  <rect x="48" y="288" width="224" height="38" rx="14" fill="#0a0e14"/>
  <text x="92" y="304" font-family="Arial" font-size="9" fill="#4b7070" text-anchor="middle">Highest</text>
  <text x="92" y="319" font-family="Arial" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">$120</text>
  <rect x="136" y="296" width="1" height="22" fill="#1a2e2e"/>
  <text x="160" y="304" font-family="Arial" font-size="9" fill="#4b7070" text-anchor="middle">Average</text>
  <text x="160" y="319" font-family="Arial" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">$32</text>
  <rect x="208" y="296" width="1" height="22" fill="#1a2e2e"/>
  <text x="240" y="304" font-family="Arial" font-size="9" fill="#4b7070" text-anchor="middle">Total</text>
  <text x="240" y="319" font-family="Arial" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">$1240</text>

  <!-- Spending trend card -->
  <rect x="32" y="348" width="256" height="232" rx="22" fill="#0d1a1a" stroke="#00f5e010"/>
  <text x="48" y="376" font-family="Arial" font-size="13" fill="#fff" font-weight="bold">Spending Trend</text>
  <text x="48" y="392" font-family="Arial" font-size="10" fill="#4b7070">Last 30 days</text>

  <!-- Bars -->
  <g font-family="Arial">
    <rect x="64" y="490" width="34" height="70" rx="5" fill="#1a3d38"/>
    <text x="81" y="574" font-size="10" fill="#4b7070" text-anchor="middle">W1</text>
    <rect x="112" y="460" width="34" height="100" rx="5" fill="#1a3d38"/>
    <text x="129" y="574" font-size="10" fill="#4b7070" text-anchor="middle">W2</text>
    <rect x="160" y="438" width="34" height="122" rx="5" fill="#00f5e0"/>
    <rect x="155" y="418" width="44" height="16" rx="8" fill="#00f5e0"/>
    <text x="177" y="430" font-size="10" fill="#0a0e14" text-anchor="middle" font-weight="bold">$420</text>
    <text x="177" y="574" font-size="10" fill="#00f5e0" text-anchor="middle" font-weight="bold">W3</text>
    <rect x="208" y="478" width="34" height="82" rx="5" fill="#1a3d38"/>
    <text x="225" y="574" font-size="10" fill="#4b7070" text-anchor="middle">W4</text>
  </g>

  <!-- Tab bar -->
  <rect x="44" y="596" width="232" height="44" rx="22" fill="#171717" stroke="#454949" stroke-width="2"/>
  <g stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M70 624 v-7 l8 -6 8 6 v7 z" stroke="#6b7280"/>
    <circle cx="113" cy="618" r="8" stroke="#6b7280"/>
    <path d="M156 611 v14 M149 618 h14" stroke="#6b7280"/>
    <path d="M192 624 v-6 M199 624 v-11 M206 624 v-8" stroke="#06e0f9"/>
    <path d="M243 624 a8 8 0 0 1 16 0 M251 613 a4 4 0 1 0 0.1 0" stroke="#6b7280"/>
  </g>
</svg>
