  <rect x="236" y="146" width="26" height="20" rx="5" fill="#ca8a0433" stroke="#ca8a0455"/>
  <text x="64" y="212" font-family="Arial" font-size="14" fill="#ffffffe6" letter-spacing="3">•••• •••• •••• ••••</text>
  <text x="64" y="240" font-family="Arial" font-size="7" fill="#ffffff66" letter-spacing="1" font-weight="bold">CARD HOLDER</text>
  <text x="64" y="252" font-family="Arial" font-size="11" fill="#fff" letter-spacing="1" font-weight="bold">EMRE</text>
  <text x="214" y="240" font-family="Arial" font-size="7" fill="#ffffff4d" text-anchor="middle" font-weight="bold">CUTOFF</text>
  <text x="214" y="252" font-family="Arial" font-size="11" fill="#00ffff" text-anchor="middle" font-weight="bold">15</text>
  <text x="252" y="240" font-family="Arial" font-size="7" fill="#ffffff4d" text-anchor="middle" font-weight="bold">DUE</text>
