    <text x="57" y="443" font-size="14" fill="#1db954" text-anchor="middle" font-weight="bold">S</text>
    <text x="82" y="442" font-size="13" fill="#fff" font-weight="bold">Spotify</text>
    <text x="276" y="436" font-size="12" fill="#fff" text-anchor="end" font-weight="bold">12$ / Ay</text>
    <text x="276" y="450" font-size="9" fill="#4b5563" text-anchor="end">Her ayın 12. günü</text>

    <rect x="32" y="470" width="256" height="50" rx="16" fill="#111b1b"/>
    <rect x="44" y="482" width="26" height="26" rx="8" fill="#1a0a2a"/>
    <text x="57" y="501" font-size="14" fill="#a259ff" text-anchor="middle" font-weight="bold">F</text>
    <text x="82" y="500" font-size="13" fill="#fff" font-weight="bold">Figma</text>
    <text x="276" y="494" font-size="12" fill="#fff" text-anchor="end" font-weight="bold">8$ / Ay</text>
    <text x="276" y="508" font-size="9" fill="#4b5563" text-anchor="end">Her ayın 1. günü</text>

    <rect x="32" y="528" width="256" height="50" rx="16" fill="#111b1b"/>
    <rect x="44" y="540" width="26" height="26" rx="8" fill="#0a1a2a"/>
    <text x="57" y="559" font-size="14" fill="#3b9eff" text-anchor="middle" font-weight="bold">i</text>
    <text x="82" y="558" font-size="13" fill="#fff" font-weight="bold">iCloud</text>
    <text x="276" y="552" font-size="12" fill="#fff" text-anchor="end" font-weight="bold">15$ / Ay</text>
    <text x="276" y="566" font-size="9" fill="#4b5563" text-anchor="end">Her ayın 20. günü</text>
