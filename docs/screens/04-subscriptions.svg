  <!-- Tab bar -->
  <rect x="44" y="596" width="232" height="44" rx="22" fill="#171717" stroke="#454949" stroke-width="2"/>
  <g stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M70 624 v-7 l8 -6 8 6 v7 z" stroke="#6b7280"/>
    <circle cx="113" cy="618" r="8" stroke="#06e0f9"/><text x="113" y="622" font-size="9" fill="#06e0f9" text-anchor="middle" stroke="none">$</text>
    <path d="M156 611 v14 M149 618 h14" stroke="#6b7280"/>
    <path d="M192 624 v-6 M199 624 v-11 M206 624 v-8" stroke="#6b7280"/>
    <path d="M243 624 a8 8 0 0 1 16 0 M251 613 a4 4 0 1 0 0.1 0" stroke="#6b7280"/>
