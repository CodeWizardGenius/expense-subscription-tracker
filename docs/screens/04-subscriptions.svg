<svg viewBox="0 0 320 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Subscriptions and cards screen">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#112426"/>
      <stop offset="1" stop-color="#121314"/>
    </linearGradient>
    <linearGradient id="ccard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1a1a"/>
      <stop offset="1" stop-color="#132626"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="308" height="648" rx="44" fill="#05090b" stroke="#1f2a2a" stroke-width="2"/>
  <rect x="16" y="16" width="288" height="628" rx="36" fill="url(#bg)"/>
  <rect x="124" y="24" width="72" height="14" rx="7" fill="#05090b"/>

  <text x="160" y="66" font-family="Arial" font-size="17" fill="#fff" text-anchor="middle" font-weight="bold">Subscriptions &amp;</text>
  <text x="160" y="86" font-family="Arial" font-size="17" fill="#fff" text-anchor="middle" font-weight="bold">Cards</text>

  <text x="44" y="116" font-family="Arial" font-size="10" fill="#6b7280" letter-spacing="3" font-weight="bold">CARDS</text>
