<svg viewBox="0 0 320 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Add transaction screen">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#112426"/>
      <stop offset="1" stop-color="#121314"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="308" height="648" rx="44" fill="#05090b" stroke="#1f2a2a" stroke-width="2"/>
  <rect x="16" y="16" width="288" height="628" rx="36" fill="url(#bg)"/>
  <rect x="124" y="24" width="72" height="14" rx="7" fill="#05090b"/>

  <text x="160" y="70" font-family="Arial" font-size="17" fill="#fff" text-anchor="middle" font-weight="bold">Transactions</text>

  <!-- Amount -->
  <text x="160" y="98" font-family="Arial" font-size="9" fill="#6b7280" text-anchor="middle" letter-spacing="2" font-weight="bold">TOTAL AMOUNT</text>
  <text x="160" y="134" font-family="Arial" font-size="30" fill="#fff" text-anchor="middle" font-weight="bold">$ 18.50</text>

  <!-- Expense / Income toggle -->
  <rect x="40" y="150" width="240" height="44" rx="14" fill="#1a2626" stroke="#33414166"/>
  <rect x="46" y="156" width="114" height="32" rx="10" fill="#003b3b"/>
  <text x="103" y="177" font-family="Arial" font-size="12" fill="#00ffff" text-anchor="middle" font-weight="bold">↘ Expense</text>
  <text x="218" y="177" font-family="Arial" font-size="12" fill="#666" text-anchor="middle" font-weight="bold">↗ Income</text>

  <!-- Categories -->
  <g font-family="Arial">
    <rect x="40" y="206" width="52" height="52" rx="14" fill="#1a2626" stroke="#00ffff80"/>
    <text x="66" y="234" font-size="16" text-anchor="middle">&#127828;</text>
    <text x="66" y="250" font-size="7" fill="#00ffff" text-anchor="middle" font-weight="bold">FOOD</text>

    <rect x="103" y="206" width="52" height="52" rx="14" fill="#141c1c" stroke="#37373766"/>
    <text x="129" y="234" font-size="16" text-anchor="middle">&#128663;</text>
    <text x="129" y="250" font-size="7" fill="#666" text-anchor="middle" font-weight="bold">TRANSPORT</text>

    <rect x="166" y="206" width="52" height="52" rx="14" fill="#141c1c" stroke="#37373766"/>
    <text x="192" y="234" font-size="16" text-anchor="middle">&#127968;</text>
    <text x="192" y="250" font-size="7" fill="#666" text-anchor="middle" font-weight="bold">RENT</text>

    <rect x="229" y="206" width="52" height="52" rx="14" fill="#141c1c" stroke="#37373766"/>
    <text x="255" y="234" font-size="16" text-anchor="middle">&#128717;</text>
    <text x="255" y="250" font-size="7" fill="#666" text-anchor="middle" font-weight="bold">SHOPPING</text>
  </g>

  <!-- Date -->
  <rect x="40" y="270" width="240" height="48" rx="12" fill="#141c1ccc" stroke="#37373766"/>
  <rect x="52" y="282" width="24" height="24" rx="7" fill="#00ffff1a"/>
  <text x="64" y="299" font-family="Arial" font-size="12" fill="#00ffff" text-anchor="middle">&#128197;</text>
  <text x="88" y="289" font-family="Arial" font-size="8" fill="#6b7280" letter-spacing="1" font-weight="bold">TRANSACTION DATE</text>
  <text x="88" y="304" font-family="Arial" font-size="12" fill="#fff" font-weight="bold">15 June 2026</text>

  <!-- Note -->
  <rect x="40" y="328" width="240" height="40" rx="12" fill="#141c1ccc" stroke="#37373766"/>
  <text x="56" y="352" font-family="Arial" font-size="12" fill="#444">&#9998;</text>
  <text x="76" y="352" font-family="Arial" font-size="12" fill="#555">Add a note...</text>

  <!-- Keypad -->
  <g font-family="Arial" font-size="22" fill="#fff" text-anchor="middle" font-weight="500">
    <text x="80" y="402">1</text><text x="160" y="402">2</text><text x="240" y="402">3</text>
    <text x="80" y="440">4</text><text x="160" y="440">5</text><text x="240" y="440">6</text>
    <text x="80" y="478">7</text><text x="160" y="478">8</text><text x="240" y="478">9</text>
    <text x="80" y="516">.</text><text x="160" y="516">0</text>
  </g>
  <text x="240" y="514" font-family="Arial" font-size="16" fill="#fff" text-anchor="middle">&#9003;</text>

  <!-- Confirm -->
  <rect x="40" y="540" width="240" height="50" rx="25" fill="#00f0f0"/>
  <text x="150" y="571" font-family="Arial" font-size="14" fill="#0d1515" text-anchor="middle" font-weight="bold">CONFIRM TRANSACTION</text>
  <circle cx="244" cy="565" r="9" fill="#0d1515"/>
  <text x="244" y="569" font-family="Arial" font-size="11" fill="#00f0f0" text-anchor="middle" font-weight="bold">✓</text>

  <!-- Tab bar -->
  <rect x="44" y="600" width="232" height="44" rx="22" fill="#171717" stroke="#454949" stroke-width="2"/>
  <g stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M70 628 v-7 l8 -6 8 6 v7 z" stroke="#6b7280"/>
    <circle cx="113" cy="622" r="8" stroke="#6b7280"/>
    <path d="M156 615 v14 M149 622 h14" stroke="#06e0f9"/>
    <path d="M192 628 v-6 M199 628 v-11 M206 628 v-8" stroke="#6b7280"/>
    <path d="M243 628 a8 8 0 0 1 16 0 M251 617 a4 4 0 1 0 0.1 0" stroke="#6b7280"/>
  </g>
</svg>
