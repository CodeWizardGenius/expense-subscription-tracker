<svg viewBox="0 0 280 110" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MONET logo">
  <defs>
    <linearGradient id="mtq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#86dde4"/>
      <stop offset="1" stop-color="#2a9aa6"/>
    </linearGradient>
  </defs>

  <!-- Wordmark letters (O is replaced by the graph circle) -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="64" fill="url(#mtq)" text-anchor="middle">
    <text x="30" y="64">M</text>
    <text x="148" y="64">N</text>
    <text x="194" y="64">E</text>
    <text x="236" y="64">T</text>
  </g>

  <!-- "O" as a market-chart circle -->
  <g>
    <circle cx="88" cy="40" r="26" fill="none" stroke="url(#mtq)" stroke-width="9"/>
    <g stroke="#39a9b4" stroke-width="1" opacity="0.45">
      <line x1="74" y1="22" x2="74" y2="58"/>
      <line x1="88" y1="18" x2="88" y2="62"/>
      <line x1="102" y1="22" x2="102" y2="58"/>
      <line x1="68" y1="30" x2="108" y2="30"/>
      <line x1="66" y1="40" x2="110" y2="40"/>
      <line x1="68" y1="50" x2="108" y2="50"/>
    </g>
    <!-- rising red arrow -->
    <path d="M70 54 L80 47 L88 51 L101 30" fill="none" stroke="#d9482f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M93 29 L102 28 L101 37" fill="none" stroke="#d9482f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Pulse line -->
  <path d="M24 88 H118 l5 -14 6 26 5 -20 4 8 H256" fill="none" stroke="#39b0bb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
</svg>
